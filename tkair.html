<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Uralsk</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.23/esri/themes/light/main.css">
    <script src="https://js.arcgis.com/4.23/"></script>
    <style>
        html, body, #viewDiv {
            height: 100%; 
            margin: 0; 
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="viewDiv"></div>
    <script>
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/layers/FeatureLayer",
            "esri/core/urlUtils",
            "esri/PopupTemplate"
        ], function(Map, MapView, FeatureLayer, urlUtils, PopupTemplate) {

            // Создаем карту
            const map = new Map({
                basemap: "streets-navigation-vector"
            });

            const view = new MapView({
                container: "viewDiv",
                map: map,
                center: [51.227821, 51.3865431], // Долгота и широта для центра карты
                zoom: 10
            });

            // Создаем шаблон всплывающего окна
            const popupTemplate = new PopupTemplate({
                title: "{Rayon_aty}", // Предположим, что в атрибутах есть поле "name"
                content: "Тип: {Shape__Area}" // Предположим, что в атрибутах есть поле "type"
            });

            // Добавляем слой с Shapefile
            const featureLayer = new FeatureLayer({
                url: "https://cacgeoportal-hub.maps.arcgis.com/home/item.html?id=2275f6ecff7d4db4aafa81d64b756524", // Замените на URL вашего Shapefile
                popupTemplate: popupTemplate
            });

            map.add(featureLayer);

        });
    </script>
</body>
</html>
